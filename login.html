<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-i18n="loginTitle">Admin Login - StreamHub</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="login-container">
        <div class="login-box">
            <div class="login-header">
                <i class="fas fa-shield-alt"></i>
                <h1 data-i18n="adminPanel">Admin Login</h1>
                <p data-i18n="loginSubtitle">Enter your credentials to access the admin panel</p>
            </div>

            <form id="loginForm">
                <div class="form-group">
                    <label><i class="fas fa-envelope"></i> <span data-i18n="email">Email</span></label>
                    <input type="email" id="loginEmail" required placeholder="admin@streamhub.com" autocomplete="email">
                </div>

                <div class="form-group">
                    <label><i class="fas fa-lock"></i> <span data-i18n="password">Password</span></label>
                    <div class="password-input">
                        <input type="password" id="loginPassword" required data-i18n-placeholder="passwordPlaceholder" placeholder="Enter your password" autocomplete="current-password">
                        <button type="button" class="toggle-password" id="togglePassword">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                </div>

                <div class="form-group">
                    <label class="checkbox-label">
                        <input type="checkbox" id="rememberMe">
                        <span data-i18n="rememberMe">Remember me</span>
                    </label>
                </div>

                <div id="loginError" class="error-message" style="display: none;">
                    <i class="fas fa-exclamation-circle"></i>
                    <span id="errorText"></span>
                </div>

                <button type="submit" class="btn-login">
                    <i class="fas fa-sign-in-alt"></i> <span data-i18n="loginBtn">Login</span>
                </button>
            </form>

            <div class="login-footer">
                <a href="index.html">
                    <i class="fas fa-arrow-left"></i> <span data-i18n="backToHome">Back to Home</span>
                </a>
            </div>

            <div class="default-credentials">
                <p><strong data-i18n="defaultCreds">Default Admin Credentials:</strong></p>
                <p>Email: admin@streamhub.com</p>
                <p>Password: admin123</p>
            </div>
        </div>

        <!-- Language Switcher -->
        <div class="language-switcher login-lang-switcher">
            <button class="lang-btn active" data-lang="en">
                <i class="fas fa-globe"></i> EN
            </button>
            <button class="lang-btn" data-lang="ar">
                <i class="fas fa-globe"></i> عربي
            </button>
        </div>
    </div>

    <script>
        // Translation dictionary for login page
        const translations = {
            en: {
                loginTitle: "Admin Login - StreamHub",
                adminPanel: "Admin Login",
                loginSubtitle: "Enter your credentials to access the admin panel",
                email: "Email",
                password: "Password",
                passwordPlaceholder: "Enter your password",
                rememberMe: "Remember me",
                invalidCredentials: "Invalid email or password",
                loginBtn: "Login",
                backToHome: "Back to Home",
                defaultCreds: "Default Admin Credentials:"
            },
            ar: {
                loginTitle: "دخول المسؤول - ستريم هاب",
                adminPanel: "دخول المسؤول",
                loginSubtitle: "أدخل بياناتك للوصول إلى لوحة التحكم",
                email: "البريد الإلكتروني",
                password: "كلمة المرور",
                passwordPlaceholder: "أدخل كلمة المرور",
                rememberMe: "تذكرني",
                invalidCredentials: "بريد إلكتروني أو كلمة مرور غير صحيحة",
                loginBtn: "دخول",
                backToHome: "العودة للرئيسية",
                defaultCreds: "بيانات الدخول الافتراضية:"
            }
        };

        // Language management
        function getCurrentLanguage() {
            return localStorage.getItem('language') || 'en';
        }

        function setCurrentLanguage(lang) {
            localStorage.setItem('language', lang);
            updateLanguage();
        }

        function updateLanguage() {
            const lang = getCurrentLanguage();
            
            // Update text content
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if (translations[lang] && translations[lang][key]) {
                    el.textContent = translations[lang][key];
                }
            });

            // Update placeholders
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                const key = el.getAttribute('data-i18n-placeholder');
                if (translations[lang] && translations[lang][key]) {
                    el.placeholder = translations[lang][key];
                }
            });

            // Update title
            document.title = translations[lang].loginTitle;

            // Update direction
            document.documentElement.lang = lang;
            document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';

            // Update active button
            document.querySelectorAll('.lang-btn').forEach(btn => {
                btn.classList.toggle('active', btn.getAttribute('data-lang') === lang);
            });
        }

        // Check if already logged in
        if (localStorage.getItem('adminLoggedIn') === 'true' || sessionStorage.getItem('adminLoggedIn') === 'true') {
            window.location.href = 'admin.html';
        }

        // Initialize language
        updateLanguage();

        // Language switcher event listeners
        document.querySelectorAll('.lang-btn').forEach(btn => {
            btn.addEventListener('click', function() {
                setCurrentLanguage(this.getAttribute('data-lang'));
            });
        });

        // Toggle password visibility
        document.getElementById('togglePassword').addEventListener('click', function() {
            const passwordInput = document.getElementById('loginPassword');
            const icon = this.querySelector('i');
            
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                passwordInput.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });

        // Login form submission
        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const remember = document.getElementById('rememberMe').checked;
            
            const errorDiv = document.getElementById('loginError');
            const errorText = document.getElementById('errorText');
            
            if (email === 'admin@streamhub.com' && password === 'admin123') {
                const storage = remember ? localStorage : sessionStorage;
                storage.setItem('adminLoggedIn', 'true');
                storage.setItem('adminEmail', email);
                storage.setItem('loginTime', new Date().getTime());
                window.location.href = 'admin.html';
            } else {
                const lang = getCurrentLanguage();
                errorText.textContent = translations[lang].invalidCredentials;
                errorDiv.style.display = 'flex';
                errorDiv.classList.add('shake');
                setTimeout(() => errorDiv.classList.remove('shake'), 500);
            }
        });
    </script>
</body>
</html>

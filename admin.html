<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - StreamHub</title>
    <link rel="stylesheet" href="./css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="admin-container">
        <header class="admin-header">
            <div>
                <h1><i class="fas fa-cog"></i> Admin Panel</h1>
                <p class="admin-welcome">Welcome, <span id="adminEmail"></span></p>
            </div>
            <div class="admin-actions">
                <a href="index.html" class="btn-back"><i class="fas fa-arrow-left"></i> Back to Site</a>
                <button id="logoutBtn" class="btn-logout"><i class="fas fa-sign-out-alt"></i> Logout</button>
            </div>
        </header>

        <div class="admin-content">
            <!-- Add/Edit Channel Form -->
            <div class="admin-card">
                <h2 id="formTitle">
                    <i class="fas fa-plus-circle"></i> Add New Channel
                </h2>
                <form id="channelForm">
                    <input type="hidden" id="editChannelId">
                    
                    <div class="form-group">
                        <label>Channel Name *</label>
                        <input type="text" id="channelName" required placeholder="e.g., ESPN HD">
                    </div>

                    <div class="form-group">
                        <label>Stream Type *</label>
                        <select id="streamType" required>
                            <option value="">Select Stream Type</option>
                            <option value="m3u8">M3U8/HLS Stream</option>
                            <option value="youtube">YouTube Live</option>
                            <option value="mp4">Direct MP4 Link</option>
                            <option value="embed">Embed URL</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Stream URL *</label>
                        <input type="url" id="channelUrl" required placeholder="Enter stream URL">
                        <small class="help-text" id="urlHelp">
                            <i class="fas fa-info-circle"></i> 
                            Select stream type to see URL format
                        </small>
                    </div>

                    <div class="form-group">
                        <label>Channel Logo URL</label>
                        <input type="url" id="channelLogo" placeholder="https://example.com/logo.png">
                    </div>

                    <div class="form-group">
                        <label>Category *</label>
                        <select id="channelCategory" required>
                            <option value="">Select Category</option>
                            <option value="sports">Sports</option>
                            <option value="news">News</option>
                            <option value="entertainment">Entertainment</option>
                            <option value="movies">Movies</option>
                            <option value="music">Music</option>
                            <option value="kids">Kids</option>
                            <option value="documentary">Documentary</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label>Description</label>
                        <textarea id="channelDesc" rows="3" placeholder="Channel description..."></textarea>
                    </div>

                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" id="channelActive" checked>
                            <span>Active (Channel visible to users)</span>
                        </label>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-primary" id="submitBtn">
                            <i class="fas fa-plus"></i> Add Channel
                        </button>
                        <button type="button" class="btn-secondary" id="cancelEdit" style="display: none;">
                            <i class="fas fa-times"></i> Cancel
                        </button>
                    </div>
                </form>
            </div>

            <!-- Channels List -->
            <div class="admin-card">
                <div class="card-header">
                    <h2><i class="fas fa-list"></i> Manage Channels</h2>
                    <div class="stats">
                        <span class="stat-item">
                            <i class="fas fa-tv"></i> 
                            Total: <strong id="totalChannels">0</strong>
                        </span>
                        <span class="stat-item">
                            <i class="fas fa-check-circle"></i> 
                            Active: <strong id="activeChannels">0</strong>
                        </span>
                    </div>
                </div>

                <div class="filter-bar">
                    <input type="text" id="adminSearch" placeholder="Search channels..." class="search-input">
                    <select id="filterCategory" class="filter-select">
                        <option value="">All Categories</option>
                        <option value="sports">Sports</option>
                        <option value="news">News</option>
                        <option value="entertainment">Entertainment</option>
                        <option value="movies">Movies</option>
                        <option value="music">Music</option>
                        <option value="kids">Kids</option>
                        <option value="documentary">Documentary</option>
                    </select>
                </div>

                <div class="channels-list" id="channelsList">
                    <!-- Channels will be loaded here -->
                </div>
            </div>
        </div>
    </div>

    <script>
        // Check authentication
        const isLoggedIn = localStorage.getItem('adminLoggedIn') === 'true' || sessionStorage.getItem('adminLoggedIn') === 'true';
        
        if (!isLoggedIn) {
            window.location.href = 'login.html';
        }

        // Display admin email
        const adminEmail = localStorage.getItem('adminEmail') || sessionStorage.getItem('adminEmail');
        document.getElementById('adminEmail').textContent = adminEmail || 'Admin';

        // Logout
        document.getElementById('logoutBtn').addEventListener('click', function() {
            if (confirm('Are you sure you want to logout?')) {
                localStorage.removeItem('adminLoggedIn');
                localStorage.removeItem('adminEmail');
                sessionStorage.removeItem('adminLoggedIn');
                sessionStorage.removeItem('adminEmail');
                window.location.href = 'login.html';
            }
        });

        // Load channels
        let channels = JSON.parse(localStorage.getItem('channels')) || [];
        let isEditMode = false;

        // Save channels
        function saveChannels() {
            localStorage.setItem('channels', JSON.stringify(channels));
            updateStats();
        }

        // Update statistics
        function updateStats() {
            document.getElementById('totalChannels').textContent = channels.length;
            const activeCount = channels.filter(ch => ch.active !== false).length;
            document.getElementById('activeChannels').textContent = activeCount;
        }

        // Update URL help text
        function updateUrlHelp() {
            const streamType = document.getElementById('streamType').value;
            const urlHelp = document.getElementById('urlHelp');
            
            const helpTexts = {
                'm3u8': 'Enter M3U8/HLS stream URL (e.g., https://example.com/stream.m3u8)',
                'youtube': 'Enter YouTube video or live stream URL (e.g., https://youtube.com/watch?v=...)',
                'mp4': 'Enter direct MP4 video URL (e.g., https://example.com/video.mp4)',
                'embed': 'Enter embed URL or iframe source URL'
            };

            urlHelp.innerHTML = `<i class="fas fa-info-circle"></i> ${helpTexts[streamType] || 'Select a stream type first'}`;
        }

        document.getElementById('streamType').addEventListener('change', updateUrlHelp);

        // Submit channel form
        document.getElementById('channelForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const id = document.getElementById('editChannelId').value;
            const name = document.getElementById('channelName').value.trim();
            const url = document.getElementById('channelUrl').value.trim();
            const logo = document.getElementById('channelLogo').value.trim();
            const category = document.getElementById('channelCategory').value;
            const description = document.getElementById('channelDesc').value.trim();
            const streamType = document.getElementById('streamType').value;
            const active = document.getElementById('channelActive').checked;

            if (!name || !url || !category || !streamType) {
                alert('Please fill in all required fields!');
                return;
            }

            const channelData = {
                name,
                url,
                logo,
                category,
                description,
                streamType,
                active
            };

            if (id) {
                // Edit existing channel
                const index = channels.findIndex(ch => ch.id === parseInt(id));
                if (index !== -1) {
                    channels[index] = { ...channels[index], ...channelData };
                }
            } else {
                // Add new channel
                channelData.id = Date.now();
                channels.push(channelData);
            }

            saveChannels();
            resetForm();
            displayAdminChannels();
            
            alert(id ? 'Channel updated successfully!' : 'Channel added successfully!');
        });

        // Reset form
        function resetForm() {
            document.getElementById('channelForm').reset();
            document.getElementById('editChannelId').value = '';
            document.getElementById('formTitle').innerHTML = '<i class="fas fa-plus-circle"></i> Add New Channel';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-plus"></i> Add Channel';
            document.getElementById('cancelEdit').style.display = 'none';
            isEditMode = false;
        }

        document.getElementById('cancelEdit').addEventListener('click', resetForm);

        // Edit channel
        function editChannel(id) {
            const channel = channels.find(ch => ch.id === id);
            if (!channel) return;

            document.getElementById('editChannelId').value = channel.id;
            document.getElementById('channelName').value = channel.name;
            document.getElementById('channelUrl').value = channel.url;
            document.getElementById('channelLogo').value = channel.logo || '';
            document.getElementById('channelCategory').value = channel.category;
            document.getElementById('channelDesc').value = channel.description || '';
            document.getElementById('streamType').value = channel.streamType;
            document.getElementById('channelActive').checked = channel.active !== false;

            document.getElementById('formTitle').innerHTML = '<i class="fas fa-edit"></i> Edit Channel';
            document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Channel';
            document.getElementById('cancelEdit').style.display = 'inline-block';
            
            updateUrlHelp();
            isEditMode = true;

            // Scroll to form
            document.querySelector('.admin-card').scrollIntoView({ behavior: 'smooth' });
        }

        // Delete channel
        function deleteChannel(id) {
            if (confirm('Are you sure you want to delete this channel?')) {
                channels = channels.filter(ch => ch.id !== id);
                saveChannels();
                displayAdminChannels();
                
                const editingId = document.getElementById('editChannelId').value;
                if (editingId && parseInt(editingId) === id) {
                    resetForm();
                }
            }
        }

        // Display admin channels
        function displayAdminChannels(filterCategory = '', searchQuery = '') {
            const channelsList = document.getElementById('channelsList');
            let filteredChannels = [...channels];

            if (filterCategory) {
                filteredChannels = filteredChannels.filter(ch => ch.category === filterCategory);
            }

            if (searchQuery) {
                filteredChannels = filteredChannels.filter(ch => 
                    ch.name.toLowerCase().includes(searchQuery.toLowerCase()) ||
                    (ch.description && ch.description.toLowerCase().includes(searchQuery.toLowerCase()))
                );
            }

            if (filteredChannels.length === 0) {
                channelsList.innerHTML = '<p class="no-data">No channels found.</p>';
                return;
            }

            channelsList.innerHTML = filteredChannels.map(channel => `
                <div class="channel-item ${channel.active === false ? 'inactive' : ''}">
                    <div class="channel-item-logo">
                        ${channel.logo ? 
                            `<img src="${channel.logo}" alt="${channel.name}">` : 
                            `<i class="fas fa-tv"></i>`
                        }
                    </div>
                    <div class="channel-item-info">
                        <h3>${channel.name}</h3>
                        <div class="channel-meta">
                            <span class="meta-item">
                                <i class="fas fa-folder"></i> ${channel.category}
                            </span>
                            <span class="meta-item">
                                <i class="fas fa-broadcast-tower"></i> ${channel.streamType}
                            </span>
                            <span class="meta-item ${channel.active !== false ? 'active' : 'inactive'}">
                                <i class="fas fa-circle"></i> 
                                ${channel.active !== false ? 'Active' : 'Inactive'}
                            </span>
                        </div>
                        <p>${channel.description || 'No description'}</p>
                    </div>
                    <div class="channel-item-actions">
                        <button class="btn-edit" onclick="editChannel(${channel.id})" title="Edit">
                            <i class="fas fa-edit"></i>
                        </button>
                        <button class="btn-delete" onclick="deleteChannel(${channel.id})" title="Delete">
                            <i class="fas fa-trash"></i>
                        </button>
                    </div>
                </div>
            `).join('');
        }

        // Admin search
        document.getElementById('adminSearch').addEventListener('input', function() {
            const category = document.getElementById('filterCategory').value;
            displayAdminChannels(category, this.value);
        });

        // Admin category filter
        document.getElementById('filterCategory').addEventListener('change', function() {
            const search = document.getElementById('adminSearch').value;
            displayAdminChannels(this.value, search);
        });

        // Initialize
        displayAdminChannels();
        updateStats();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamHub - Live TV Channels</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --primary: #6C5CE7;
            --secondary: #A29BFE;
            --dark: #2D3436;
            --darker: #1E272E;
            --text: #DFE6E9;
            --danger: #FF7675;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: linear-gradient(135deg, #667EEA 0%, #764BA2 100%);
            min-height: 100vh;
            color: var(--text);
        }

        .container {
            max-width: 1400px;
            margin: auto;
            padding: 0 20px;
        }

        .header {
            background: rgba(45, 52, 54, 0.95);
            padding: 1rem 0;
            position: sticky;
            top: 0;
            z-index: 1000;
            box-shadow: 0 4px 20px rgba(0,0,0,.3);
        }

        .header .container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 1.8rem;
            font-weight: bold;
            color: var(--primary);
        }

        .logo i {
            font-size: 2rem;
        }

        .nav {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .nav-link {
            color: var(--text);
            text-decoration: none;
            padding: .5rem 1rem;
            border-radius: 8px;
            font-weight: 500;
        }

        .nav-link:hover,
        .nav-link.active {
            background: var(--primary);
            color: white;
        }

        .search-box {
            display: flex;
            align-items: center;
            background: rgba(255,255,255,.1);
            border-radius: 25px;
            padding: .5rem 1rem;
            min-width: 250px;
        }

        .search-box i {
            margin-right: 10px;
        }

        .search-box input {
            background: transparent;
            border: 0;
            outline: 0;
            color: var(--text);
            width: 100%;
        }

        .search-box input::placeholder {
            color: rgba(255,255,255,.5);
        }

        .main-content {
            padding: 2rem 0;
            min-height: calc(100vh - 200px);
        }

        .section-title {
            font-size: 2.5rem;
            margin-bottom: 2rem;
            text-align: center;
            text-shadow: 2px 2px 4px rgba(0,0,0,.3);
        }

        .channels-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px,1fr));
            gap: 2rem;
            margin-bottom: 3rem;
        }

        .channel-card {
            background: rgba(255,255,255,.1);
            border-radius: 15px;
            overflow: hidden;
            cursor: pointer;
            transition: .25s;
            border: 2px solid transparent;
        }

        .channel-card:hover {
            transform: translateY(-6px);
            border-color: var(--primary);
            box-shadow: 0 10px 30px rgba(108,92,231,.4);
        }

        .channel-logo {
            width: 100%;
            height: 180px;
            background: linear-gradient(135deg,var(--primary),var(--secondary));
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: white;
            overflow: hidden;
        }

        .channel-logo img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 20px;
        }

        .channel-info {
            padding: 1.5rem;
        }

        .channel-name {
            font-size: 1.3rem;
            font-weight: bold;
            margin-bottom: .5rem;
            color: white;
        }

        .channel-tags {
            display: flex;
            gap: .5rem;
            flex-wrap: wrap;
            margin-bottom: .5rem;
        }

        .channel-category,
        .stream-type {
            display: inline-block;
            padding: .3rem .8rem;
            border-radius: 20px;
            font-size: .85rem;
        }

        .channel-category {
            background: var(--primary);
            color: white;
        }

        .stream-type {
            background: rgba(162,155,254,.3);
            color: white;
        }

        .channel-desc {
            color: var(--text);
            font-size: .9rem;
            line-height: 1.5;
            opacity: .9;
        }

        .no-channels {
            grid-column: 1/-1;
            text-align: center;
            padding: 4rem 2rem;
        }

        .no-channels i {
            font-size: 5rem;
            opacity: .3;
            display: block;
            margin-bottom: 1rem;
        }

        .no-channels p {
            font-size: 1.3rem;
            opacity: .7;
        }

        .footer {
            background: rgba(45,52,54,.95);
            padding: 2rem 0;
            text-align: center;
        }

        .footer p {
            margin-bottom: .5rem;
        }

        .admin-link {
            color: var(--primary);
            text-decoration: none;
            font-weight: bold;
        }

        .player-section {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,.95);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .player-container {
            background: var(--darker);
            border-radius: 15px;
            max-width: 1200px;
            width: 100%;
            padding: 2rem;
            position: relative;
        }

        .close-player {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--danger);
            color: white;
            border: 0;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.2rem;
            z-index: 10;
        }

        .player-header {
            margin-bottom: 1rem;
            padding-right: 50px;
        }

        .player-header h2 {
            font-size: 2rem;
            margin-bottom: .5rem;
        }

        .player-header p {
            opacity: .8;
        }

        .stream-type-badge {
            display: inline-block;
            padding: .5rem 1rem;
            border-radius: 20px;
            font-size: .85rem;
            font-weight: bold;
            margin-top: .5rem;
        }

        .stream-type-badge.m3u8 {
            background: linear-gradient(135deg,#6C5CE7,#A29BFE);
        }

        .stream-type-badge.youtube {
            background: linear-gradient(135deg,#FF0000,#FF4444);
        }

        #videoPlayer {
            width: 100%;
            border-radius: 10px;
            background: black;
            max-height: 70vh;
        }

        #youtubePlayer {
            width: 100%;
            aspect-ratio: 16/9;
            border-radius: 10px;
            overflow: hidden;
            background: black;
        }

        #embedPlayer {
            width: 100%;
            height: 70vh;
            border-radius: 10px;
            background: black;
            border: 0;
        }

        .player-controls {
            display: flex;
            gap: 1rem;
            margin-top: 1rem;
            justify-content: center;
        }

        .control-btn {
            background: var(--primary);
            color: white;
            border: 0;
            padding: .8rem 1.5rem;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
        }

        @media(max-width:768px) {
            .header .container {
                flex-direction: column;
            }

            .search-box {
                width: 100%;
            }

            .channels-grid {
                grid-template-columns: repeat(auto-fill,minmax(200px,1fr));
                gap: 1rem;
            }

            .player-section {
                padding: 1rem;
            }

            .player-container {
                padding: 1rem;
            }
        }
    </style>
</head>

<body>

<header class="header">
    <div class="container">

        <div class="logo">
            <i class="fas fa-tv"></i>
            <span>StreamHub</span>
        </div>

        <nav class="nav">
            <a href="#" class="nav-link active" data-category="all">All Channels</a>
            <a href="#" class="nav-link" data-category="sports">Sports</a>
            <a href="#" class="nav-link" data-category="news">News</a>
            <a href="#" class="nav-link" data-category="entertainment">Entertainment</a>
            <a href="#" class="nav-link" data-category="movies">Movies</a>
            <a href="#" class="nav-link" data-category="music">Music</a>
        </nav>

        <div class="search-box">
            <i class="fas fa-search"></i>
            <input id="searchInput" type="text" placeholder="Search channels...">
        </div>

    </div>
</header>


<main class="main-content">

    <div class="container">

        <div class="player-section" id="playerSection">

            <div class="player-container">

                <button class="close-player" id="closePlayer">
                    <i class="fas fa-times"></i>
                </button>

                <div class="player-header">
                    <h2 id="currentChannelName">Channel Name</h2>
                    <p id="currentChannelDesc">Channel Description</p>
                    <span class="stream-type-badge" id="streamTypeBadge"></span>
                </div>

                <video id="videoPlayer"
                       controls
                       autoplay
                       style="display:none"></video>

                <div id="youtubePlayer" style="display:none"></div>

                <iframe id="embedPlayer"
                        style="display:none"
                        allowfullscreen></iframe>

                <div class="player-controls">

                    <button class="control-btn" id="prevChannel">
                        <i class="fas fa-backward"></i>
                        Previous
                    </button>

                    <button class="control-btn" id="nextChannel">
                        Next
                        <i class="fas fa-forward"></i>
                    </button>

                </div>

            </div>

        </div>


        <section class="channels-section">

            <h1 class="section-title">
                Live TV Channels
            </h1>

            <div class="channels-grid" id="channelsGrid">
                <p style="grid-column:1/-1;text-align:center">
                    Loading channels...
                </p>
            </div>

        </section>

    </div>

</main>


<footer class="footer">

    <div class="container">

        <p>
            &copy; 2024 StreamHub. All rights reserved.
        </p>

        <a href="login.html" class="admin-link">
            <i class="fas fa-lock"></i>
            Admin Login
        </a>

    </div>

</footer>


<script>

"use strict";


/* DEFAULT CHANNELS */

const defaultChannels = [

    {
        id: 1,
        name: "BBC News Live",
        url: "https://d2vnbkvjbims7j.cloudfront.net/containerA/LTN/playlist.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/62/BBC_News_2019.svg/320px-BBC_News_2019.svg.png",
        category: "news",
        description: "24/7 Breaking News Coverage",
        streamType: "m3u8",
        active: true
    },

    {
        id: 2,
        name: "NASA TV",
        url: "https://ntv1.akamaized.net/hls/live/2014075/NASA-NTV1-HLS/master.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/commons/thumb/e/e5/NASA_logo.svg/200px-NASA_logo.svg.png",
        category: "news",
        description: "NASA's Official Live Stream",
        streamType: "m3u8",
        active: true
    },

    {
        id: 3,
        name: "Red Bull TV",
        url: "https://rbmn-live.akamaized.net/hls/live/590964/BoRB-AT/master.m3u8",
        logo: "https://i.imgur.com/7GackIk.png",
        category: "sports",
        description: "Extreme Sports & Entertainment",
        streamType: "m3u8",
        active: true
    },

    {
        id: 4,
        name: "Al Jazeera English",
        url: "https://live-hls-web-aje.getaj.net/AJE/index.m3u8",
        logo: "https://upload.wikimedia.org/wikipedia/en/thumb/f/f2/Aljazeera_eng.svg/240px-Aljazeera_eng.svg.png",
        category: "news",
        description: "International News Channel",
        streamType: "m3u8",
        active: true
    },

    {
        id: 5,
        name: "Lofi Girl Radio",
        url: "https://www.youtube.com/watch?v=jfKfPfyJRdk",
        logo: "https://yt3.googleusercontent.com/2YQXS_emon2PnADRRIB9JGrGGhbnCgAIWcuXzXdZa0FTKqdTA2Jt6om0A-fD8PXJ6cGbT_NJcg=s176-c-k-c0x00ffffff-no-rj",
        category: "music",
        description: "24/7 Lofi Hip Hop Music",
        streamType: "youtube",
        active: true
    }

];


/*
    SAFE CHANNEL LOADING

    If localStorage is broken,
    the website automatically resets it.
*/

function loadChannels() {

    try {

        const saved =
            localStorage.getItem("channels");

        if (!saved) {
            return defaultChannels.slice();
        }

        const parsed =
            JSON.parse(saved);

        if (!Array.isArray(parsed)) {
            throw new Error("Invalid channel data");
        }

        return parsed;

    } catch (error) {

        console.warn(
            "Invalid saved channel data. Resetting.",
            error
        );

        try {
            localStorage.removeItem("channels");
        } catch (e) {}

        return defaultChannels.slice();
    }
}


let channels = loadChannels();

let currentChannelIndex = 0;

let currentCategory = "all";

let hls = null;


/*
    DISPLAY CHANNELS
*/

function displayChannels(
    filter = "all",
    searchQuery = ""
) {

    const grid =
        document.getElementById("channelsGrid");

    if (!grid) {
        return;
    }


    let filtered =
        channels.filter(
            channel =>
                channel &&
                channel.active !== false
        );


    if (filter !== "all") {

        filtered =
            filtered.filter(
                channel =>
                    channel.category === filter
            );
    }


    if (searchQuery) {

        const query =
            searchQuery.toLowerCase();

        filtered =
            filtered.filter(channel =>

                String(channel.name || "")
                    .toLowerCase()
                    .includes(query)

                ||

                String(channel.description || "")
                    .toLowerCase()
                    .includes(query)
            );
    }


    if (!filtered.length) {

        grid.innerHTML = `
            <div class="no-channels">
                <i class="fas fa-tv"></i>
                <p>No channels found</p>
            </div>
        `;

        return;
    }


    const icons = {
        m3u8: "fa-stream",
        youtube: "fa-youtube",
        mp4: "fa-film",
        embed: "fa-code"
    };


    grid.innerHTML = filtered.map(channel => {

        const logo =
            channel.logo
            ? `
                <img
                    src="${channel.logo}"
                    alt="${channel.name || "Channel"}"
                    onerror="
                        this.style.display='none';
                        this.parentElement
                        .querySelector('.fallback-icon')
                        .style.display='block';
                    "
                >
            `
            : "";


        return `

            <div
                class="channel-card"
                data-id="${channel.id}"
            >

                <div class="channel-logo">

                    ${logo}

                    <i
                        class="fas fa-tv fallback-icon"
                        style="${channel.logo ? "display:none" : ""}"
                    ></i>

                </div>


                <div class="channel-info">

                    <h3 class="channel-name">
                        ${channel.name || "Unnamed Channel"}
                    </h3>


                    <div class="channel-tags">

                        <span class="channel-category">
                            ${channel.category || "other"}
                        </span>


                        <span class="stream-type">

                            <i class="fas ${
                                icons[channel.streamType]
                                || "fa-broadcast-tower"
                            }"></i>

                            ${String(
                                channel.streamType || "stream"
                            ).toUpperCase()}

                        </span>

                    </div>


                    <p class="channel-desc">
                        ${channel.description || "No description available"}
                    </p>

                </div>

            </div>

        `;

    }).join("");


    grid
        .querySelectorAll(".channel-card")
        .forEach(card => {

            card.addEventListener(
                "click",
                () => {

                    const id =
                        Number(card.dataset.id);

                    const index =
                        channels.findIndex(
                            channel =>
                                channel.id === id
                        );

                    if (index >= 0) {
                        playChannel(index);
                    }

                }
            );

        });

}


/*
    PLAY CHANNEL
*/

function playChannel(index) {

    const channel =
        channels[index];

    if (!channel) {
        return;
    }


    currentChannelIndex = index;


    const section =
        document.getElementById(
            "playerSection"
        );


    const video =
        document.getElementById(
            "videoPlayer"
        );


    const youtube =
        document.getElementById(
            "youtubePlayer"
        );


    const embed =
        document.getElementById(
            "embedPlayer"
        );


    document.getElementById(
        "currentChannelName"
    ).textContent =
        channel.name || "";


    document.getElementById(
        "currentChannelDesc"
    ).textContent =
        channel.description || "";


    const badge =
        document.getElementById(
            "streamTypeBadge"
        );


    badge.textContent =
        String(
            channel.streamType || "stream"
        ).toUpperCase();


    badge.className =
        "stream-type-badge " +
        (channel.streamType || "");


    section.style.display = "flex";


    video.style.display = "none";

    youtube.style.display = "none";

    embed.style.display = "none";


    if (channel.streamType === "m3u8") {

        video.style.display = "block";

        /*
            Native browser playback where supported.
        */

        video.src =
            channel.url || "";

        video.play().catch(() => {});

    }


    else if (channel.streamType === "youtube") {

        youtube.style.display = "block";

        playYouTube(
            channel.url,
            youtube
        );

    }


    else if (channel.streamType === "mp4") {

        video.style.display = "block";

        video.src =
            channel.url || "";

        video.play().catch(() => {});

    }


    else if (channel.streamType === "embed") {

        embed.style.display = "block";

        embed.src =
            channel.url || "";

    }

}


/*
    YOUTUBE
*/

function getYouTubeVideoId(url) {

    const match =
        String(url || "").match(
            /^.*(youtu\.be\/|v\/|u\/\w\/|embed\/|watch\?v=|&v=)([^#&?]*).*/
        );

    return match &&
        match[2] &&
        match[2].length === 11
        ? match[2]
        : null;
}


function playYouTube(
    url,
    container
) {

    const videoId =
        getYouTubeVideoId(url);


    if (!videoId) {

        container.innerHTML =
            "<p style='padding:2rem;text-align:center'>Invalid YouTube URL.</p>";

        return;
    }


    container.innerHTML = "";


    const iframe =
        document.createElement("iframe");


    iframe.width = "100%";

    iframe.height = "100%";

    iframe.src =
        "https://www.youtube.com/embed/" +
        videoId +
        "?autoplay=1";

    iframe.frameBorder = "0";

    iframe.allow =
        "autoplay; encrypted-media";

    iframe.allowFullscreen = true;


    container.appendChild(iframe);

}


/*
    CLOSE PLAYER
*/

function closePlayer() {

    const section =
        document.getElementById(
            "playerSection"
        );


    section.style.display = "none";


    const video =
        document.getElementById(
            "videoPlayer"
        );


    video.pause();

    video.removeAttribute("src");

    video.load();


    document.getElementById(
        "youtubePlayer"
    ).innerHTML = "";


    document.getElementById(
        "embedPlayer"
    ).src = "";

}


/*
    NEXT
*/

function nextChannel() {

    const active =
        channels.filter(
            channel =>
                channel &&
                channel.active !== false
        );


    if (!active.length) {
        return;
    }


    const current =
        channels[currentChannelIndex];


    const position =
        active.findIndex(
            channel =>
                channel.id ===
                (current && current.id)
        );


    const next =
        active[
            (position + 1) %
            active.length
        ];


    const nextIndex =
        channels.findIndex(
            channel =>
                channel.id === next.id
        );


    playChannel(nextIndex);

}


/*
    PREVIOUS
*/

function prevChannel() {

    const active =
        channels.filter(
            channel =>
                channel &&
                channel.active !== false
        );


    if (!active.length) {
        return;
    }


    const current =
        channels[currentChannelIndex];


    const position =
        active.findIndex(
            channel =>
                channel.id ===
                (current && current.id)
        );


    const previous =
        active[
            (position - 1 + active.length) %
            active.length
        ];


    const previousIndex =
        channels.findIndex(
            channel =>
                channel.id === previous.id
        );


    playChannel(previousIndex);

}


/*
    START WEBSITE
*/

document.addEventListener(
    "DOMContentLoaded",
    function () {

        displayChannels();


        document
            .querySelectorAll(".nav-link")
            .forEach(function (link) {

                link.addEventListener(
                    "click",
                    function (event) {

                        event.preventDefault();


                        document
                            .querySelectorAll(".nav-link")
                            .forEach(function (item) {

                                item.classList.remove(
                                    "active"
                                );

                            });


                        link.classList.add("active");


                        currentCategory =
                            link.dataset.category ||
                            "all";


                        displayChannels(
                            currentCategory,
                            document.getElementById(
                                "searchInput"
                            ).value
                        );

                    }
                );

            });


        document
            .getElementById("searchInput")
            .addEventListener(
                "input",
                function (event) {

                    displayChannels(
                        currentCategory,
                        event.target.value
                    );

                }
            );


        document
            .getElementById("closePlayer")
            .addEventListener(
                "click",
                closePlayer
            );


        document
            .getElementById("nextChannel")
            .addEventListener(
                "click",
                nextChannel
            );


        document
            .getElementById("prevChannel")
            .addEventListener(
                "click",
                prevChannel
            );

    }
);

</script>

</body>
</html>
